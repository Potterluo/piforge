# PiForge, containerised.
#
# One service: the pod is the sandbox boundary, so the agent, the shells a user
# opens and the browser they watch all live in this container. /data holds the
# SQLite database, the master key, the sandboxes and the terminal sessions, so it
# must be a volume — losing it loses every project.
#
# Run it with the fake agent (no model account):
#   docker compose up --build
# Run it against a real provider:
#   PIFORGE_SEED_PASSWORD=... docker compose up -d --build
# and add the provider in Settings -> Models.
services:
  piforge:
    build:
      context: .
      dockerfile: Dockerfile
    # Pull a published image with `PIFORGE_IMAGE=... docker compose up -d`, or let
    # compose build it from this checkout.
    image: ${PIFORGE_IMAGE:-piforge:dev}
    container_name: piforge
    # The image's entrypoint is already tini (see Dockerfile), so it is PID 1 and
    # reaps the shells and agent processes the control plane spawns. `init: true`
    # here adds a *second* init in front of it: the entrypoint's tini then is not
    # PID 1, logs "Tini is not running as PID 1 and isn't registered as a child
    # subreaper", and only the outer one reaps. One init, and it is the image's.
    ports:
      - "7700:7700"
    environment:
      # Seeded on the first boot only; change these before exposing the port.
      PIFORGE_SEED_EMAIL: ${PIFORGE_SEED_EMAIL:-admin@piforge.local}
      PIFORGE_SEED_PASSWORD: ${PIFORGE_SEED_PASSWORD:-piforge-admin-123}
      PIFORGE_SEED_USER_EMAIL: ${PIFORGE_SEED_USER_EMAIL:-dev@piforge.local}
      PIFORGE_SEED_USER_PASSWORD: ${PIFORGE_SEED_USER_PASSWORD:-piforge-dev-123}
      # Keys are sealed with this; a deployment should set it and keep it.
      PIFORGE_MASTER_KEY: ${PIFORGE_MASTER_KEY:-}
      # Empty means "no proxy". Set it when the sandbox browser needs one to
      # reach the internet (e.g. host.docker.internal:7892).
      PIFORGE_BROWSER_PROXY: ${PIFORGE_BROWSER_PROXY:-}
      # The model gateway runs inside this container, so *it* needs a proxy when
      # the provider endpoint is not directly reachable.
      HTTP_PROXY: ${PIFORGE_HTTP_PROXY:-}
      HTTPS_PROXY: ${PIFORGE_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
      # Bubblewrap is available inside the image; firejail is not installed.
      PIFORGE_ISOLATION: ${PIFORGE_ISOLATION:-none}
      PIFORGE_DEFAULT_PROVIDER: ${PIFORGE_DEFAULT_PROVIDER:-shared-anthropic}
    volumes:
      - piforge-data:/data
    # Two deliberate capability decisions (FR-14.2):
    #
    #   * SYS_ADMIN is NOT added. It is optional, not required: without it a
    #     session's skills are read-only copies (`copy-ro`). Adding it would
    #     upgrade the mechanism to read-only bind mounts (`bind-ro`), where the
    #     kernel enforces read-only and sessions share one frozen snapshot
    #     instead of each holding a copy. A broad capability weakens the
    #     container boundary, so it is not the default.
    #   * DAC_OVERRIDE is dropped. The control plane runs as root, and root with
    #     CAP_DAC_OVERRIDE ignores the 0444 that makes a copied skill read-only.
    #     Dropping it is what makes `copy-ro` true instead of aspirational; it
    #     costs nothing because every file the control plane writes is its own.
    #     Without this line the product still works but reports `copy`, not
    #     `copy-ro`, rather than claiming a guarantee it does not have.
    cap_drop:
      - DAC_OVERRIDE
    # The control plane spawns shells and chromium; give it room for both.
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  piforge-data:
