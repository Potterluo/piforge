# The two-service shape: piforge has no Docker CLI and no daemon, sandbox-runner
# owns both.
#
#   docker compose -f docker-compose.yml -f docker-compose.runner.yml up -d --build
#
# `docker-compose.yml` on its own still describes the single-container deployment
# (the pod *is* the sandbox), and nothing here changes it until this overlay is
# named. What the overlay adds:
#
#   - sandbox-runner, the only service that mounts /var/run/docker.sock. It runs
#     the same sandbox provider code the single-host build does, so the container
#     rules (one workspace per (user, project), mount verification, checkout via
#     the sandbox's own API, branch worktrees as `gem`) exist once;
#   - piforged switched to `-sandbox runner`, talking to it over the
#     sandbox-control network with a shared bearer token.
#
# Why the data volume is on both services, at the same path:
#
#   a sandbox's workspace is a *directory* that has to mean one thing to three
#   processes: the control plane writes skills/MCP files into it, the runner hands
#   it to the daemon when it creates the container, and the sandbox sees it at
#   /workspace. Mounting one volume at /data in both services is the "same
#   directory" half of that; the other half is that the daemon must be able to
#   resolve it, and it cannot resolve a path that only exists inside these two
#   containers. A bind mount source is resolved on the *daemon's* host, so
#   `-v /data/sandboxes/<u>/<p>` from inside the runner creates an empty directory
#   on the daemon's filesystem (on Docker Desktop, inside its VM) and the sandbox
#   gets an empty /workspace while the control plane keeps writing into the
#   volume. Nothing errors: both sides name the same string, which is why the
#   provider's own data-root check cannot see it either.
#
#   So sandboxes mount the volume itself, with each project's directory as the
#   volume subpath (`--mount type=volume,...,volume-subpath=sandboxes/<u>/<p>`,
#   relative to the volume's root, which is /data here). That needs
#   SANDBOX_WORKSPACE_VOLUME below, a named volume (the `name:` on the volume —
#   the daemon resolves the name, not a path), and Docker Engine 25+ for the
#   subpath. It works unchanged on Linux hosts and on Docker Desktop.
#
# Sandbox containers join `piforge-sandboxes` and are addressed by container name
# (SANDBOX_CONTAINER_ENDPOINT=1), so no sandbox port is published on the host.
# piforge joins that network to reach them; the runner joins it too because the
# checkout it performs runs from the runner process, against the container's API.
#
# The volume and networks are named explicitly, so they are not prefixed with the
# compose project name: the volume name is what the runner passes to the daemon,
# and the network name is what SANDBOX_NETWORK refers to. A prefixed name would
# still work as long as both sides used it, but a `name:` makes the three
# references (daemon, runner, control plane) one string that cannot drift.

services:
  piforge:
    environment:
      PIFORGE_SANDBOX: runner
      PIFORGE_SANDBOX_RUNNER_URL: http://sandbox-runner:7801
      PIFORGE_SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN to a long random string}
      PIFORGE_SANDBOX_IMAGE: ${PIFORGE_SANDBOX_IMAGE:?set PIFORGE_SANDBOX_IMAGE to the all-in-one sandbox image}
      # Each sandbox gets its own API key: the runner generates it when it creates
      # the container and reports it once, and piforged seals it in the sandbox row.
      # PIFORGE_SANDBOX_API_KEY is only a *fixed* override for debugging one
      # deployment (all sandboxes share it); leave it empty for tenants.
      PIFORGE_SANDBOX_API_KEY: ${PIFORGE_SANDBOX_API_KEY:-}
      PIFORGE_SANDBOX_NETWORK: piforge-sandboxes
    networks:
      - default
      - sandbox-control
      - piforge-sandboxes
    depends_on:
      - sandbox-runner

  sandbox-runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runner
    image: ${PIFORGE_RUNNER_IMAGE:-piforge/sandbox-runner:dev}
    container_name: piforge-sandbox-runner
    # Reap the `docker` processes this service spawns.
    init: true
    environment:
      # The runner refuses to start without a token, and every request must carry
      # it. There is no TLS between the two services: keep them on an internal
      # network and do not publish 7801.
      RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN to a long random string}
      SANDBOX_RUNNER_ADDR: 0.0.0.0:7801
      SANDBOX_DATA_ROOT: /data/sandboxes
      SANDBOX_IMAGE: ${PIFORGE_SANDBOX_IMAGE:?set PIFORGE_SANDBOX_IMAGE to the all-in-one sandbox image}
      # Empty is the default and the secure value: sandbox.Docker then generates a
      # 32-byte key per container. Set it only to pin one key for debugging.
      SANDBOX_API_KEY: ${PIFORGE_SANDBOX_API_KEY:-}
      SANDBOX_NETWORK: piforge-sandboxes
      # Report http://piforge-<hash8>:8080 instead of a published loopback port:
      # piforged is a container here, so 127.0.0.1:<port> would be its own loopback.
      SANDBOX_CONTAINER_ENDPOINT: "1"
      # Give each sandbox its project's directory out of the volume the daemon
      # already knows, instead of a bind source that only exists in here. The name
      # is the `name:` of the volume below; the root is where that volume is
      # mounted here, which is what turns /data/sandboxes/<u>/<p> into the
      # volume-relative subpath `sandboxes/<u>/<p>` a sandbox mount takes.
      SANDBOX_WORKSPACE_VOLUME: piforge-data
      SANDBOX_WORKSPACE_VOLUME_ROOT: /data
    volumes:
      # The only mount of the daemon socket in this deployment. It is deliberately
      # not `:ro`: a socket mount's read-only flag does not restrict the API, and
      # writing it that way would suggest a boundary that is not there.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same volume, same path, as piforge — see the note above.
      - piforge-data:/data
    networks:
      - sandbox-control
      - piforge-sandboxes
    restart: unless-stopped

networks:
  sandbox-control:
  # A fixed name: SANDBOX_NETWORK refers to it, and the runner must be able to
  # resolve sandbox container names on it while it provisions a checkout.
  piforge-sandboxes:
    name: piforge-sandboxes

volumes:
  # Named, and the same name in the single-container deployment: the sandbox mount
  # refers to the daemon's volume by name, so this string is a contract.
  piforge-data:
    name: piforge-data
