# The isolated deployment: a control plane, a sandbox-runner, and one sandbox
# image — with the agent running *inside* the sandbox and the workspace living
# only there.
#
#   docker compose -f docker-compose.runner.yml up -d --build
#
#   pwsh scripts/up-isolated.ps1
#
# That script builds the three images in the only order that works, runs the
# preflight (which checks what is *inside* the sandbox image, not just its tag)
# and then starts this file. The defaults below are the tags it builds, so a
# plain `docker compose -f docker-compose.runner.yml up` uses the same images.
#
# This file is deliberately self-contained. It used to be an overlay that had to
# be combined with `docker-compose.yml` and then completed with
# `PIFORGE_AGENT_IN_SANDBOX=1` / `SANDBOX_WORKSPACE_VOLUME=...`; stage 3 of
# docs/EXECUTION-BOUNDARY.md made the sandboxed placement the default for the
# container providers, and stage 4 deleted the switch, so the isolated shape is a
# plain `up` with no extra flags and no shared workspace volume.
#
# What "isolated" means here, concretely (docs/SANDBOX-DEPLOY.md §1.4.6):
#
#   - each (user, project) gets its own container and its own workspace volume
#     (`piforge-ws-<pair hash>`); neither this control plane nor the runner
#     mounts that volume;
#   - the agent (`pi --mode rpc`) is a process inside that container, owned by a
#     supervisor that survives a restart of this file's `piforge` service, and
#     the restarted control plane reattaches to it;
#   - the only credential the sandbox holds is the per-session model gateway
#     token (and, for an HTTP MCP server, a per-session broker token) — never a
#     provider key and never an MCP credential;
#   - sandbox containers are addressed by name on a bridge of their *tenant's*
#     own (`piforge-t-<hash>`), attached to the control plane and the runner at
#     creation, and publish no port on the host. There is no shared sandbox
#     bridge any more: two tenants' sandboxes have no route to each other, which
#     is what makes "a sandbox cannot reach another sandbox" true rather than
#     "the image's nginx says 401" (docs/EXECUTION-BOUNDARY.md §11);
#   - each tenant bridge is created `--internal` (deploy/tenant-egress.json,
#     default `none`), so a sandbox has no route to the public internet while the
#     gateway on that same bridge stays reachable. `open` is an explicit policy
#     value, and a mode this deployment cannot enforce ("allowlist") fails the
#     start instead of being ignored (docs/EXECUTION-BOUNDARY.md §12.5).
#
# Requirements: Docker Engine 25+ (volume-subpath), Go 1.25+ for the preflight,
# a daemon the runner can reach through /var/run/docker.sock, and the three
# images below. `sandbox-image` builds the sandbox image from `piforge` — that is
# what puts the agent runtime inside it — and its entrypoint exits, so it exists
# only so a cold checkout builds both from one `--build`.
services:
  piforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PIFORGE_IMAGE:-piforge:isolated}
    container_name: piforge
    ports:
      - "${PIFORGE_PUBLISH:-7700}:7700"
    environment:
      # Seeded on the first boot only; change these before exposing the port.
      PIFORGE_SEED_EMAIL: ${PIFORGE_SEED_EMAIL:-admin@piforge.local}
      PIFORGE_SEED_PASSWORD: ${PIFORGE_SEED_PASSWORD:-piforge-admin-123}
      PIFORGE_SEED_USER_EMAIL: ${PIFORGE_SEED_USER_EMAIL:-dev@piforge.local}
      PIFORGE_SEED_USER_PASSWORD: ${PIFORGE_SEED_USER_PASSWORD:-piforge-dev-123}
      # Keys are sealed with this; a deployment should set it and keep it. The
      # gateway's own signing key is written next to the database on the data
      # volume, so agents that outlive this process keep working.
      PIFORGE_MASTER_KEY: ${PIFORGE_MASTER_KEY:-}
      PIFORGE_DEFAULT_PROVIDER: ${PIFORGE_DEFAULT_PROVIDER:-shared-anthropic}
      PIFORGE_BOOTSTRAP_PROVIDER: ${PIFORGE_BOOTSTRAP_PROVIDER:-}
      PIFORGE_BOOTSTRAP_PROVIDER_KEY: ${PIFORGE_BOOTSTRAP_PROVIDER_KEY:-}
      HTTP_PROXY: ${PIFORGE_HTTP_PROXY:-}
      HTTPS_PROXY: ${PIFORGE_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,piforge,sandbox-runner
      # The agent's gateway has to be reachable *from the sandbox*, by name: the
      # agent is a process in another container, so 127.0.0.1 would be its own.
      PIFORGE_GATEWAY_URL: http://piforge:7700
      # No PIFORGE_AGENT_IN_SANDBOX here any more: stage 4 of
      # docs/EXECUTION-BOUNDARY.md deleted the switch, so a runner placement always
      # runs the agent inside its sandbox. `=1` would still be accepted as a no-op;
      # `=0` is refused at startup, which is the point.
      PIFORGE_SANDBOX: runner
      PIFORGE_SANDBOX_RUNNER_URL: http://sandbox-runner:7801
      PIFORGE_SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN to a long random string}
      PIFORGE_SANDBOX_IMAGE: ${PIFORGE_SANDBOX_IMAGE:-piforge/sandbox-agent:isolated}
      # The agent inside the sandbox needs the binaries the sandbox image
      # provides; these are also the defaults, named here for anyone reading the
      # file instead of the flag help.
      PIFORGE_SANDBOX_AGENT_LAUNCHER: /opt/piforge/piforged
      PIFORGE_SANDBOX_AGENT_PI: pi
      # Each sandbox gets its own API key: the runner generates it when it creates
      # the container and reports it once, and piforged seals it in the sandbox
      # row. PIFORGE_SANDBOX_API_KEY is only a *fixed* override for debugging one
      # deployment; leave it empty for tenants.
      PIFORGE_SANDBOX_API_KEY: ${PIFORGE_SANDBOX_API_KEY:-}
      PIFORGE_SANDBOX_NETWORK: piforge-sandboxes
      # Per-tenant networks. Every sandbox joins a bridge of its own tenant's,
      # and these are the containers joined to it so the product keeps working:
      # the control plane serves the browser/file/shell panels through the
      # sandbox API and is the model gateway the sandbox calls. `shared` is the
      # single-host shape and is not what this file ships.
      PIFORGE_SANDBOX_NETWORK_MODE: ${PIFORGE_SANDBOX_NETWORK_MODE:-tenant}
      PIFORGE_SANDBOX_JOIN_CONTAINERS: piforge,piforge-sandbox-runner
      # The per-tenant quota. These are the *default* every tenant gets; the file
      # below can give one account more or less (internal/tenantlimits).
      PIFORGE_SANDBOX_CPUS: ${PIFORGE_SANDBOX_CPUS:-1}
      PIFORGE_SANDBOX_MEMORY: ${PIFORGE_SANDBOX_MEMORY:-2g}
      PIFORGE_SANDBOX_PIDS: ${PIFORGE_SANDBOX_PIDS:-256}
      PIFORGE_TENANT_MAX_SANDBOXES: ${PIFORGE_TENANT_MAX_SANDBOXES:-3}
      # Read-only, from deploy/tenant-limits.json unless up-isolated.ps1 was
      # pointed at another file. A policy that cannot be parsed fails the start.
      PIFORGE_TENANT_LIMITS_FILE: /etc/piforge/tenant-limits.json
      # What a sandbox may reach beyond this control plane. `none` creates each
      # tenant's bridge with `docker network create --internal`: the sandbox has
      # no route to the public internet, while /gw/llm and /gw/mcp keep working
      # because this container is joined to that bridge. The default of the
      # mounted file is closed, and a mode this deployment cannot enforce
      # ("allowlist") fails the start rather than being ignored.
      PIFORGE_TENANT_EGRESS_FILE: /etc/piforge/tenant-egress.json
      # The outbound URL policy's allow-list (docs/SANDBOX-DEPLOY.md 1.9). The
      # mounted file is empty by default, which means "public http(s) only": a
      # tenant-supplied MCP server URL, provider base_url, forge api_base or
      # skill repository is resolved, every address is checked, and the dial is
      # pinned to the verified address. An internal server has to be written
      # down here, with its ports; this file can only widen, never narrow.
      PIFORGE_URL_ALLOW_FILE: /etc/piforge/url-policy.json
    volumes:
      - piforge-data:/data
      # The quota policy is configuration, reviewed with the deployment and
      # mounted read-only; the container never needs to write it.
      - ${PIFORGE_TENANT_LIMITS_MOUNT:-./deploy/tenant-limits.json}:/etc/piforge/tenant-limits.json:ro
      # The egress policy, read-only, for the admin report and for the mode each
      # create carries. The runner reads the same file and is the side that
      # enforces it (it creates the tenant bridges).
      - ${PIFORGE_TENANT_EGRESS_MOUNT:-./deploy/tenant-egress.json}:/etc/piforge/tenant-egress.json:ro
      # The URL allow-list, read-only, reviewed with the compose file. Empty is
      # the default and is a valid policy; a file that does not parse fails the
      # start (cmd/piforged loads it before anything is created).
      - ${PIFORGE_URL_ALLOW_MOUNT:-./deploy/url-policy.json}:/etc/piforge/url-policy.json:ro
    networks:
      - default
      - sandbox-control
      - piforge-sandboxes
    depends_on:
      - sandbox-runner
    # The control plane runs as root; dropping DAC_OVERRIDE is what makes the
    # read-only skill copies (0444) real instead of aspirational. It costs
    # nothing because every file it writes is its own.
    cap_drop:
      - DAC_OVERRIDE
    shm_size: "1gb"
    restart: unless-stopped

  sandbox-runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runner
    image: ${PIFORGE_RUNNER_IMAGE:-piforge/sandbox-runner:isolated}
    container_name: piforge-sandbox-runner
    # Reap the `docker` processes this service spawns.
    init: true
    environment:
      # There is no TLS between the two services: keep them on an internal
      # network and do not publish 7801.
      RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN to a long random string}
      SANDBOX_RUNNER_ADDR: 0.0.0.0:7801
      SANDBOX_DATA_ROOT: /data/sandboxes
      SANDBOX_IMAGE: ${PIFORGE_SANDBOX_IMAGE:-piforge/sandbox-agent:isolated}
      # Empty is the default and the secure value: sandbox.Docker then generates a
      # 32-byte key per container. Set it only to pin one key for debugging.
      SANDBOX_API_KEY: ${PIFORGE_SANDBOX_API_KEY:-}
      SANDBOX_NETWORK: piforge-sandboxes
      # The runner is the process that creates the bridges, so it is the one that
      # must know the mode and the containers to join. A tenant bridge with
      # nothing on it would isolate the sandbox from the gateway and from its own
      # checkout, so the CLI refuses to start in this mode without the list.
      SANDBOX_NETWORK_MODE: ${PIFORGE_SANDBOX_NETWORK_MODE:-tenant}
      SANDBOX_JOIN_CONTAINERS: piforge,piforge-sandbox-runner
      # Backstops for a create that carries no limit of its own (a direct API
      # call, not the control plane). The control plane sends the tenant's
      # policy, which wins; these keep a hand-made request from being unlimited.
      SANDBOX_CPUS: ${PIFORGE_SANDBOX_CPUS:-1}
      SANDBOX_MEMORY: ${PIFORGE_SANDBOX_MEMORY:-2g}
      SANDBOX_PIDS: ${PIFORGE_SANDBOX_PIDS:-256}
      # Report http://piforge-<hash8>:8080 instead of a published loopback port:
      # piforged is a container here, so 127.0.0.1:<port> would be its own loopback.
      SANDBOX_CONTAINER_ENDPOINT: "1"
      # The egress policy *this* process applies: it creates the tenant bridges,
      # and `--internal` on that bridge is the whole of "none". It reads the same
      # file the control plane does, validates it at boot, and refuses a mode it
      # cannot enforce (allowlist) or one the network shape cannot hold (none on a
      # shared bridge). Empty SANDBOX_EGRESS_MODE follows the network mode:
      # closed with per-tenant bridges, open with a shared one.
      SANDBOX_EGRESS_FILE: /etc/piforge/tenant-egress.json
      SANDBOX_EGRESS_MODE: ${PIFORGE_TENANT_EGRESS_MODE:-}
      # No SANDBOX_WORKSPACE_VOLUME / SANDBOX_WORKSPACE_VOLUME_ROOT: those describe
      # the *shared volume* shape, which contradicts the sandboxed placement (each
      # sandbox gets a volume of its own). The provider refuses the combination.
    volumes:
      # The only mount of the daemon socket in this deployment. Not `:ro`: a
      # socket mount's read-only flag does not restrict the API, and writing it
      # that way would suggest a boundary that is not there.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only policy, the same file the control plane mounts.
      - ${PIFORGE_TENANT_EGRESS_MOUNT:-./deploy/tenant-egress.json}:/etc/piforge/tenant-egress.json:ro
    networks:
      - sandbox-control
      - piforge-sandboxes
    restart: unless-stopped

  # Build-only: produces the sandbox image the two services above name. It has no
  # long-running process, so it exits immediately; `docker compose up` starts it,
  # sees it exit and carries on. Building it from `piforge` is what keeps the
  # agent's `pi` on exactly the version the control plane was built with.
  sandbox-image:
    build:
      context: .
      dockerfile: deploy/Dockerfile.sandbox-agent
      args:
        AGENT_IMAGE: ${PIFORGE_IMAGE:-piforge:isolated}
    image: ${PIFORGE_SANDBOX_IMAGE:-piforge/sandbox-agent:isolated}
    container_name: piforge-sandbox-image
    depends_on:
      - piforge
    entrypoint: ["/bin/true"]
    restart: "no"

networks:
  sandbox-control:
  # A fixed name: SANDBOX_NETWORK refers to it, and the runner must be able to
  # resolve sandbox container names on it while it provisions a checkout.
  piforge-sandboxes:
    name: piforge-sandboxes

volumes:
  # The control plane's own state (SQLite, master.key, gateway.key, artifacts).
  # The workspaces are *not* here: each sandbox has a volume of its own,
  # `piforge-ws-<pair hash>`, which nothing else mounts.
  piforge-data:
    name: ${PIFORGE_DATA_VOLUME:-piforge-data}
