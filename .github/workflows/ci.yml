name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    # WHAT THIS JOB NEEDS AND WHAT WENT WRONG TWICE
    #
    # The skill-mount tests assert the read-only projection the deployment runs
    # with (`cap-drop ALL` + the measured add-back set, root-owned 0555
    # launcher), so they need the deployment's user: root. Two ways of getting
    # root were tried and both failed for reasons unrelated to the code:
    #
    #  1. A bare runner as the unprivileged `runner` user: the skill-mount tests
    #     failed with `unlinkat … permission denied`, testing a different rule
    #     than the one the product ships with.
    #  2. `container: golang:1.25-bookworm`: root on a checkout owned by uid
    #     1001 — the right user — but `go build ./...` exited 1 with no git
    #     message, because Go stamps VCS metadata and git refused the tree:
    #       fatal: detected dubious ownership in repository at '/__w/piforge/piforge'
    #     The step meant to allow it wrote `safe.directory` as `$(pwd)/..`, a
    #     value git compares literally against the repository path, so it never
    #     matched; checkout's own entry lives in a *temporary* global config
    #     that does not reach later steps. Reproduced: the same `..` value on a
    #     uid-1001 checkout still says "dubious ownership", and the same tree
    #     with a normalized `/src` builds.
    #
    # So: the same image, run from a plain runner step as root (readable log,
    # no container-job config to lose), and the safe directory arrives as
    # GIT_CONFIG_* environment — a normalized absolute path that every git the
    # container starts inherits, instead of a ~/.gitconfig a later step may not
    # read.
    steps:
      - uses: actions/checkout@v4

      - name: go build, vet and test as root in the shipped image
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src/backend \
            -e GOFLAGS=-mod=mod \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/src \
            golang:1.25-bookworm \
            sh -euc 'go build ./... && go vet ./... && go test ./... -count=1'

      # The module graph was tidied on Windows; a Linux-only file must not need
      # a go.mod edit. GOFLAGS=-mod=mod lets the build add what is missing, and
      # this then fails the job instead of letting the edit pass unseen. The
      # first docker run edited the bind-mounted $PWD, so the diff is real.
      - name: go.mod was already tidy
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/src \
            golang:1.25-bookworm \
            sh -euc 'git diff --exit-code -- backend/go.mod backend/go.sum \
              || { echo "::error::go.mod/go.sum changed during the build; run go mod tidy and commit it"; exit 1; }'

  web:
    name: web (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test -- --run
      - run: pnpm exec next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # The e2e suite and the from-zero delivery drill are not here on purpose: they
  # start real containers and drive a real browser (Chromium plus the sandbox
  # image), which a default runner cannot do within a sane time budget. Run them
  # locally: `cd e2e && pnpm test` and `pwsh scripts/deliver-check.ps1`.
  docs:
    name: docs (links and diagram sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every README/diagram reference exists
        run: |
          set -eu
          missing=0
          for f in README.md docs/index.html docs/screenshots/live/README.md; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            grep -oE '(docs/)?(diagrams|screenshots/live)/[A-Za-z0-9._-]+\.(svg|png)' "$f" \
              | sed 's#^docs/##' | sort -u | while read -r ref; do
                  if [ ! -f "docs/$ref" ]; then echo "broken reference in $f: $ref"; exit 1; fi
                done
          done
          echo "references ok"
      - name: diagrams are well-formed XML
        run: |
          set -eu
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for p in sorted(glob.glob("docs/diagrams/*.svg")):
              try:
                  ET.parse(p)
              except Exception as e:
                  print(f"{p}: {e}"); bad = 1
          sys.exit(bad)
          PY
