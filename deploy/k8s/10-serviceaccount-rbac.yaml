# The two service accounts and the exact permission set the provider needs.
#
# `piforge-control-plane` is what piforged runs as when it is deployed in the
# cluster (a Deployment of its own, or a Kubernetes Job driving it). It gets the
# Role below and nothing else.
#
# `piforge-sandbox` is what a *sandbox pod* runs as. It is bound to nothing, and
# the pod is created with automountServiceAccountToken: false, so a prompt
# injection inside a sandbox has no credential to spend against the cluster. The
# account exists so the pods have a stable, named identity rather than "default".
#
# The rules are the provider's preflight, one line per review it makes
# (internal/sandbox/k8s_preflight.go, k8sRequiredAccess): if you add a verb to
# that list, add it here, and a deployment that forgets one fails the boot with
# the verb named instead of failing a session.
#
#   kubectl apply -f deploy/k8s/10-serviceaccount-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: piforge-control-plane
  namespace: piforge
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: piforge-sandbox
  namespace: piforge
  labels:
    app.kubernetes.io/name: piforge-sandbox
    app.kubernetes.io/part-of: piforge
# Never mount a token into a sandbox. The provider sets this on the pod too; the
# account says it a second time so a pod created by hand in this namespace does
# not get one by inheritance.
automountServiceAccountToken: false
---
# Namespaced: the four objects a sandbox is made of.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: piforge-sandbox-lifecycle
  namespace: piforge
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  # pods/exec is the byte stream the agent runs on (Attach/Reattach) and the
  # debug interface (Exec). It is a *subresource*: granting "pods" is not enough,
  # and forgetting it is the failure that looks like "the agent never starts".
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "delete"]
  # The per-sandbox API key. Only the control plane's account may read it: the
  # sandbox receives it through a Secret reference and never lists secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: piforge-sandbox-lifecycle
  namespace: piforge
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: piforge-sandbox-lifecycle
subjects:
  - kind: ServiceAccount
    name: piforge-control-plane
    namespace: piforge
---
# Cluster-scoped, and deliberately three rules: the namespace the provider
# refuses to start without, the runtime class it refuses to start without, and
# the access review it asks so that both answers are stated rather than assumed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: piforge-sandbox-preflight
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: piforge-sandbox-preflight
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: piforge-sandbox-preflight
subjects:
  - kind: ServiceAccount
    name: piforge-control-plane
    namespace: piforge
