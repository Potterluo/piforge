# The namespace every sandbox object lives in, plus the two policies that bound
# what one tenant's pod can consume.
#
# Apply this first: the provider refuses to start against a namespace that does
# not exist (it will not create one — a namespace is a quota, a NetworkPolicy and
# an RBAC boundary, and those are an operator's decisions, not a provider's).
#
#   kubectl apply -f deploy/k8s/00-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: piforge
  labels:
    app.kubernetes.io/name: piforge
    app.kubernetes.io/part-of: piforge
    # Pod Security Admission.
    #
    # `baseline` is enforced and `restricted` is only a warning — and the delta is
    # the one thing this provider does that `restricted` forbids:
    # securityContext.capabilities.add. The sandbox container drops ALL and adds
    # back exactly the five the image was measured to need (CHOWN, DAC_OVERRIDE,
    # FOWNER, SETUID, SETGID; internal/sandbox/k8s_objects.go). Under a real API
    # server, enforcing `restricted` answers:
    #
    #   pods "piforge-…" is forbidden: violates PodSecurity "restricted:latest":
    #   unrestricted capabilities (container "sandbox" must not include "CHOWN",
    #   "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID" in
    #   securityContext.capabilities.add)
    #
    # So the choice is stated rather than hidden: the pod is `restricted` in every
    # other respect (non-root, no privilege escalation, RuntimeDefault seccomp,
    # no host namespaces or paths, dropped capabilities), and the five add-backs
    # are the documented price of the image's own bootstrap. A cluster that
    # *mandates* `restricted` (a policy engine, not this label) must drop those
    # five — which means an image whose entrypoint needs none of them.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# One sandbox is one pod with one volume. A quota is the only thing that bounds
# the *number* of them: the provider applies per-tenant CPU/memory limits to each
# pod, but nothing stops a tenant with many projects from having many sandboxes —
# that is -tenant-max-sandboxes on the control plane, and this quota is the
# cluster-side backstop for the day that guard is misconfigured.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: piforge-sandboxes
  namespace: piforge
spec:
  hard:
    # Raise these together with -tenant-max-sandboxes; they are a ceiling, not a
    # policy. 200 pods is roughly 25 projects per account for 8 accounts.
    pods: "200"
    requests.cpu: "200"
    requests.memory: 400Gi
    persistentvolumeclaims: "200"
    requests.storage: 2Ti
    services: "200"
    secrets: "400"
---
# A default request/limit for anything in this namespace that forgets one. The
# provider always sets both (from the tenant policy), so this is the fallback for
# a pod a human creates while debugging — and having it means such a pod cannot
# land unlimited next to the sandboxes.
apiVersion: v1
kind: LimitRange
metadata:
  name: piforge-defaults
  namespace: piforge
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 2Gi
